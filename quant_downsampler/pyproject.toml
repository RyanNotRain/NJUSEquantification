[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-downsampler"
version = "1.0.0"
description = "Tick downsampling, factor evaluation, backtesting, and minute LSTM research pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "torch>=2.2",
]

[project.scripts]
qd-downsample = "scripts.run_step1:main"
qd-factors = "scripts.run_factor_eval:main"
qd-backtest = "scripts.run_backtest:main"
qd-lstm = "scripts.run_lstm:main"
qd-lstm-full = "scripts.run_lstm_full:main"
qd-lstm-full-eval = "scripts.evaluate_lstm_full:main"
qd-factor-robustness = "scripts.run_factor_robustness:main"
qd-backtest-robustness = "scripts.run_backtest_robustness:main"
qd-lstm-research = "scripts.run_lstm_research:main"
qd-lstm-strategy = "scripts.run_lstm_strategy:main"
qd-lstm-baselines = "scripts.run_lstm_baselines:main"
qd-lstm-adjust = "scripts.adjust_lstm_fusion:main"
qd-lstm-hybrid = "scripts.run_lstm_hybrid:main"
qd-lstm-return = "scripts.run_lstm_return:main"
qd-lstm-return-baselines = "scripts.run_lstm_return_baselines:main"
qd-lstm-strategy-compare = "scripts.run_lstm_strategy_comparison:main"

[tool.setuptools]
packages = ["qd", "scripts"]
